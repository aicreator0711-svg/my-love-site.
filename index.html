<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MXA | Nightmare</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=VT323&display=swap');

        :root {
            --main-bg: #05000a; /* أسود مائل للبنفسجي الغامق جدا */
            --glow-color: #5500ff;
            --blood-color: #8a0303;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background-color: black;
            overflow: hidden;
            font-family: 'VT323', monospace;
            cursor: none; /* إخفاء المؤشر لزيادة الواقعية */
        }

        /* --- تأثير التلفاز القديم (بدون كتابات عشوائية) --- */
        .scanlines {
            position: fixed; inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%),
                        linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 3px 100%;
            z-index: 90; pointer-events: none;
        }
        
        .vignette {
            position: fixed; inset: 0;
            background: radial-gradient(circle, transparent 40%, black 90%);
            z-index: 91; pointer-events: none;
        }

        /* --- واجهة الدخول --- */
        #intro-screen {
            position: absolute; inset: 0;
            background: #000;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }

        .enter-btn {
            color: #fff;
            font-size: 1.5rem; /* صغير ومناسب للهاتف */
            border: 1px solid #333;
            padding: 10px 20px;
            text-transform: uppercase;
            letter-spacing: 4px;
            animation: flicker 2s infinite;
            cursor: pointer;
            background: transparent;
        }

        /* --- المحتوى الرئيسي --- */
        #main-stage {
            display: none;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #1a0029 0%, #000 80%);
            position: relative;
        }

        #mxa-text {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem; /* حجم متوسط للهاتف */
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 0 10px var(--glow-color);
            letter-spacing: 8px;
            opacity: 1;
            transition: opacity 1s;
        }

        /* --- الوحش (العقرب) --- */
        #monster-container {
            display: none;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 250px; /* حجم واقعي للهاتف */
            height: auto;
            filter: drop-shadow(0 0 30px #000); /* ظل ثقيل */
        }

        /* صورة عقرب واقعية (صورة خارجية) */
        #scorpion-img {
            width: 100%;
            filter: contrast(150%) brightness(0.6) sepia(1) hue-rotate(280deg) saturate(300%);
            /* هذا الفلتر يجعل أي صورة تبدو كمسخ بنفسجي غامق ومرعب */
        }

        /* --- تأثير الهجوم --- */
        .jumpscare-anim {
            animation: lunging 0.2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
        }

        @keyframes lunging {
            0% { transform: translate(-50%, -50%) scale(1); }
            40% { transform: translate(-50%, -50%) scale(0.9); } /* تراجع للخلف قليلاً للاستعداد */
            100% { transform: translate(-50%, -50%) scale(20); opacity: 0; } /* هجوم في الوجه */
        }

        /* فلاش أبيض عند الهجوم */
        .flash {
            position: fixed; inset: 0; background: white;
            opacity: 0; pointer-events: none; z-index: 200;
        }
        .flash-active { animation: flashbang 0.5s ease-out; }
        @keyframes flashbang { 0% { opacity: 1; } 100% { opacity: 0; } }

        /* --- الدماء الواقعية --- */
        #blood-overlay {
            position: fixed; inset: 0;
            z-index: 150; pointer-events: none;
        }

        .blood-splatter {
            position: absolute;
            background: var(--blood-color);
            border-radius: 50%;
            opacity: 0.9;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.5), 
                        inset 2px 2px 5px rgba(255,255,255,0.2);
        }

        .blood-drip {
            position: absolute;
            background: var(--blood-color);
            width: 100%;
            border-radius: 0 0 10px 10px;
            animation: dripping 4s ease-in forwards;
        }

        @keyframes dripping {
            0% { height: 0; opacity: 1; }
            80% { opacity: 0.9; }
            100% { height: 400px; opacity: 0.6; }
        }

        /* --- تأثيرات إضافية --- */
        @keyframes flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
            52% { opacity: 0.2; }
            54% { opacity: 1; }
        }

    </style>
</head>
<body>

    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div id="flash-screen" class="flash"></div>
    <div id="blood-overlay"></div>

    <div id="intro-screen">
        <button class="enter-btn" onclick="startHorror()">[ ENTER ]</button>
    </div>

    <div id="main-stage">
        <div id="mxa-text">MXA</div>
        
        <div id="monster-container">
            <img id="scorpion-img" src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/14/Scorpion_PSF.png/800px-Scorpion_PSF.png" alt="Monster">
        </div>
    </div>

    <script>
        const intro = document.getElementById('intro-screen');
        const stage = document.getElementById('main-stage');
        const mxa = document.getElementById('mxa-text');
        const monster = document.getElementById('monster-container');
        const flash = document.getElementById('flash-screen');
        const bloodLayer = document.getElementById('blood-overlay');

        function startHorror() {
            // إخفاء زر الدخول
            intro.style.transition = "opacity 1s";
            intro.style.opacity = 0;
            
            setTimeout(() => {
                intro.style.display = 'none';
                stage.style.display = 'block';
                
                // بدء السيناريو
                runSequence();
            }, 1000);
        }

        function runSequence() {
            // المرحلة 1: 5 ثواني من الهدوء المريب
            // النص ينبض ببطء
            mxa.animate([
                { opacity: 0.8, transform: 'translate(-50%, -50%) scale(1)' },
                { opacity: 0.4, transform: 'translate(-50%, -50%) scale(0.98)' },
                { opacity: 0.8, transform: 'translate(-50%, -50%) scale(1)' }
            ], {
                duration: 2000,
                iterations: Infinity
            });

            setTimeout(() => {
                // تحول الحروف
                triggerTransformation();
            }, 5000);
        }

        function triggerTransformation() {
            // النص يتشوش ويختفي
            mxa.style.filter = "blur(10px)";
            mxa.style.opacity = 0;

            setTimeout(() => {
                mxa.style.display = 'none';
                
                // ظهور العقرب (ليس فجأة، بل يخرج من الظلام)
                monster.style.display = 'block';
                monster.animate([
                    { opacity: 0, filter: 'blur(5px)' },
                    { opacity: 1, filter: 'blur(0)' }
                ], { duration: 1000, fill: 'forwards' });

                // المرحلة 2: العقرب يحدق بك لـ 3 ثواني
                setTimeout(() => {
                    attack();
                }, 3000);

            }, 500);
        }

        function attack() {
            // الهجوم المرعب
            monster.classList.add('jumpscare-anim');
            flash.classList.add('flash-active');
            
            // اهتزاز الهاتف (يعمل على الأندرويد)
            if (navigator.vibrate) navigator.vibrate([200, 100, 200]);

            setTimeout(() => {
                // بعد الهجوم مباشرة: شاشة سوداء
                stage.style.background = "black";
                monster.style.display = "none";
                
                // بدء الدماء
                simulateBloodSplatter();
            }, 200);
        }

        function simulateBloodSplatter() {
            // نصنع تأثير دم يضرب الشاشة (Splash)
            for(let i=0; i<5; i++) {
                setTimeout(() => {
                    createSplatter();
                }, i * 300);
            }
        }

        function createSplatter() {
            const splatter = document.createElement('div');
            splatter.classList.add('blood-splatter');
            
            // مواقع عشوائية للطخة
            const size = Math.random() * 80 + 40; // حجم الطخة
            const x = Math.random() * 80 + 10; // موقع أفقي
            const y = Math.random() * 40 + 10; // موقع عمودي (في النصف العلوي)
            
            splatter.style.width = size + 'px';
            splatter.style.height = size + 'px';
            splatter.style.left = x + 'vw';
            splatter.style.top = y + 'vh';
            
            // شكل غير منتظم للطخة (Organic Shape)
            splatter.style.borderRadius = `${Math.random()*50+30}% ${Math.random()*50+30}% ${Math.random()*50+30}% ${Math.random()*50+30}%`;

            // إضافة السيلان (Drip) للطخة
            const drip = document.createElement('div');
            drip.classList.add('blood-drip');
            // عرض السيلان عشوائي
            drip.style.width = (Math.random() * 10 + 5) + 'px'; 
            drip.style.left = (Math.random() * 50 + 20) + '%';
            
            splatter.appendChild(drip);
            bloodLayer.appendChild(splatter);
        }

    </script>
</body>
</html>
