<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXA | Experience</title>
    <style>
        /* استدعاء خط بكسل مرعب */
        @import url('https://fonts.googleapis.com/css2?family=Creepster&family=Press+Start+2P&display=swap');

        :root {
            --purple-glow: #4b0082;
            --blood-red: #8a0303;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: #000;
            overflow: hidden;
            font-family: 'Press Start 2P', cursive;
        }

        /* تأثير التلفاز القديم المتطور */
        .crt-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 3px, 3px 100%;
            pointer-events: none; z-index: 100; opacity: 0.8;
        }

        /* تأثير الوشوشة (Noise) */
        .noise {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://media.giphy.com/media/oEI9uWUqW5nJC/giphy.gif');
            opacity: 0.05; pointer-events: none; z-index: 99;
        }

        /* شاشة الدخول */
        #enter-screen {
            position: fixed; inset: 0; background: #050008;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000; cursor: pointer; transition: 1s;
        }

        #enter-btn {
            font-size: 1.5rem; color: #fff;
            text-shadow: 0 0 10px var(--blood-red);
            letter-spacing: 5px; animation: pulse 2s infinite;
        }

        /* المسرح الرئيسي */
        #stage {
            height: 100vh; width: 100vw;
            display: none; position: relative;
            background: radial-gradient(circle, #1a0029 0%, #000 70%);
        }

        /* نص MXA المرعب */
        #mxa-text {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 5rem; color: #8a2be2;
            text-shadow: 3px 3px 0px #220033, 0 0 20px #ff00ea;
            letter-spacing: 15px; filter: blur(0.5px);
            transition: 0.3s cubic-bezier(.17,.67,.83,.67);
        }

        /* العقرب - مخفي في البداية */
        #scorpion-wrap {
            display: none; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            font-size: 10rem; filter: drop-shadow(0 0 20px red) invert(1);
        }

        /* أنيميشن الهجوم (Jump Scare) */
        .jumpscare {
            animation: attack-move 0.25s forwards !important;
        }

        @keyframes attack-move {
            0% { transform: translate(-50%, -50%) scale(1); filter: brightness(1); }
            40% { transform: translate(-50%, -50%) scale(1.2) rotate(5deg); }
            100% { transform: translate(-50%, -50%) scale(15); filter: brightness(0); visibility: hidden; }
        }

        /* الدماء المسالة */
        .blood-drip {
            position: absolute; top: -100px;
            background: linear-gradient(to bottom, transparent, var(--blood-red));
            width: 20px; border-radius: 0 0 15px 15px;
            filter: blur(1px); z-index: 50;
        }

        /* اهتزاز الشاشة */
        .shake { animation: shake-anim 0.1s infinite; }
        @keyframes shake-anim {
            0% { transform: translate(2px, 2px); }
            50% { transform: translate(-3px, -1px); }
            100% { transform: translate(1px, 2px); }
        }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="noise"></div>

    <div id="enter-screen" onclick="initHorror()">
        <div id="enter-btn">[ ENTER THE VOID ]</div>
    </div>

    <div id="stage">
        <div id="mxa-text">MXA</div>
        <div id="scorpion-wrap">🦂</div>
        <div id="blood-curtain"></div>
    </div>

    <script>
        const stage = document.getElementById('stage');
        const mxa = document.getElementById('mxa-text');
        const scorp = document.getElementById('scorpion-wrap');
        const bloodCurtain = document.getElementById('blood-curtain');

        function initHorror() {
            document.getElementById('enter-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('enter-screen').style.display = 'none';
                stage.style.display = 'block';
                startTimeline();
            }, 1000);
        }

        function startTimeline() {
            // المرحلة 1: هدوء مريب (5 ثواني)
            setTimeout(() => {
                transformToScorpion();
            }, 5000);
        }

        function transformToScorpion() {
            // تأثير خلل (Glitch) عند التحول
            mxa.style.filter = "blur(20px) contrast(200%)";
            mxa.style.opacity = "0";
            
            setTimeout(() => {
                mxa.style.display = "none";
                scorp.style.display = "block";
                document.body.classList.add('shake');
                
                // المرحلة 2: العقرب يتربص (3 ثواني)
                setTimeout(() => {
                    executeJumpScare();
                }, 3000);
            }, 500);
        }

        function executeJumpScare() {
            scorp.classList.add('jumpscare');
            
            // المرحلة 3: السواد التام والدماء
            setTimeout(() => {
                document.body.classList.remove('shake');
                stage.style.background = "black";
                scorp.style.display = "none";
                startBloodRain();
            }, 250);
        }

        function startBloodRain() {
            setInterval(() => {
                const drip = document.createElement('div');
                drip.className = 'blood-drip';
                const size = Math.random() * 40 + 10;
                drip.style.left = Math.random() * 100 + 'vw';
                drip.style.width = size + 'px';
                drip.style.height = (Math.random() * 200 + 100) + 'px';
                
                // تحريك الدم كأنه يسيل
                drip.animate([
                    { transform: 'translateY(-100%)', opacity: 0 },
                    { opacity: 1, offset: 0.1 },
                    { transform: 'translateY(100vh)', opacity: 0.8 }
                ], {
                    duration: Math.random() * 2000 + 3000,
                    easing: 'linear'
                });

                bloodCurtain.appendChild(drip);
                setTimeout(() => drip.remove(), 5000);
            }, 150);
        }
    </script>
</body>
</html>
